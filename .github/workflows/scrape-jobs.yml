# GitHub Actions: Atualização Automática de Vagas Remotas
# Dispara 2x ao dia (08:00 e 20:00 UTC) para manter o banco fresco.

name: Atualizar Vagas Remotas

on:
  schedule:
    - cron: '0 8 * * *'
    - cron: '0 20 * * *'
  workflow_dispatch:  # Permite execução manual pelo painel do GitHub

jobs:
  scrape-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: |
          pip install --upgrade pip
          pip install -r scrapers/requirements.txt
          playwright install --with-deps chromium

      - name: Configurar variáveis de ambiente
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> $GITHUB_ENV
          echo "SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }}" >> $GITHUB_ENV

      - name: Executar spiders
        run: |
          cd scrapers
          scrapy crawl linkedin_jobs --nolog || true
          scrapy crawl indeed_jobs --nolog || true

      - name: Notificar sucesso
        if: success()
        run: echo "Scraping concluído com sucesso!"