# GitHub Actions: Atualização Automática de Vagas Remotas
# Dispara 2x ao dia (08:00 e 20:00 UTC). Se nenhum spider entregar vagas, o workflow FALHA
# e o GitHub notifica por e-mail (não há mais `|| true` escondendo erros).
#
# Secrets necessários (Settings > Secrets and variables > Actions):
#   SUPABASE_URL, SUPABASE_SERVICE_KEY            (obrigatórios)
#   ADZUNA_APP_ID, ADZUNA_APP_KEY, JOOBLE_API_KEY (opcionais: ativam essas fontes)

name: Atualizar Vagas Remotas

on:
  schedule:
    - cron: '0 8 * * *'
    - cron: '0 20 * * *'
  workflow_dispatch:  # Permite execução manual pelo painel do GitHub

permissions:
  contents: read

concurrency:
  group: scrape-jobs
  cancel-in-progress: false

jobs:
  scrape-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: scrapers

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scrapers/requirements.txt

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt pytest

      - name: Testes dos scrapers
        run: python -m pytest -q

      - name: Executar spiders
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SCRAPE_RESULT_FILE: scrape_result.json
          # Opcionais: sem a chave, o spider avisa e é ignorado.
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
        run: |
          rm -f scrape_result.json
          # Uma fonte com erro não impede as outras; o passo seguinte falha se nada foi persistido.
          for spider in remoteok_jobs adzuna_jobs jooble_jobs; do
            scrapy crawl "$spider" || echo "::warning::Spider $spider terminou com erro"
          done

      - name: Validar resultado (falha se 0 vagas)
        run: python check_result.py scrape_result.json
